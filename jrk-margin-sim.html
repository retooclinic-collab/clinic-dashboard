const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(pw){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(SALT),iterations:ITER,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(IV)},key,u8(CT));
  const html=new TextDecoder().decode(pt);
  document.open();document.write(html);document.close();
}
async function go(){const pw=document.getElementById('pw').value;try{await open(pw);if(document.getElementById('keep')?.checked)localStorage.setItem('jrkSimPw',pw);}catch(e){document.getElementById('err').style.display='block';localStorage.removeItem('jrkSimPw');}}
document.getElementById('go').onclick=go;document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')go();});
const saved=localStorage.getItem('jrkSimPw');if(saved){document.getElementById('pw').value=saved;go();}
